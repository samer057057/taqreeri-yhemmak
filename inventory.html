{% extends "base.html" %}{% block body %}<div class="card"><h2>المخزون المتاح</h2><form method="get"><input name="q" placeholder="بحث بالموديل أو IMEI أو الرقم التسلسلي"><button class="btn">بحث</button></form><div class="scroll"><table><tr><th>الشركة</th><th>الموديل</th><th>اللون</th><th>السعة</th><th>IMEI</th><th>التكلفة</th></tr>{% for d in devices %}<tr><td>{{d.brand}}</td><td>{{d.model}}</td><td>{{d.color or '-'}}</td><td>{{d.capacity or '-'}}</td><td>{{d.imei or '-'}}</td><td>{{d.cost}}</td></tr>{% else %}<tr><td colspan="6">المخزون فارغ.</td></tr>{% endfor %}</table></div></div>{% endblock %}
