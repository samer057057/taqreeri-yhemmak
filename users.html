{% extends "base.html" %}{% block body %}<div class="card"><h2>المستخدمون</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>اسم المستخدم</label><input name="username" required><label>كلمة المرور (12 حرفاً على الأقل)</label><input type="password" name="password" minlength="12" required><label>الصلاحية</label><select name="role"><option value="staff">موظف</option><option value="admin">مدير</option></select><button class="btn">إنشاء مستخدم</button></form><h3>الحسابات الحالية</h3><table><tr><th>المستخدم</th><th>الصلاحية</th><th>الحالة</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{'نشط' if u.active else 'معطل'}}</td></tr>{% endfor %}</table></div>{% endblock %}
