<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقريري يهمك</title><style>
body{margin:0;background:#f3f5fa;color:#17213a;font-family:Tahoma,Arial}header{background:#17264b;color:white;padding:17px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.brand{font-size:21px;font-weight:bold}nav{display:flex;gap:7px;flex-wrap:wrap}nav a,.btn{background:#eaf0ff;color:#2947aa;text-decoration:none;padding:9px 12px;border-radius:9px;border:0;cursor:pointer;font-weight:bold;font-size:13px}.wrap{max-width:1100px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #e5eaf2;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #2030500b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#748097;font-size:12px}.num{font-size:26px;font-weight:bold;margin-top:9px}h2{font-size:21px}h3{font-size:16px}label{display:block;font-size:12px;color:#64718a;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce2ed;border-radius:8px;font:inherit;box-sizing:border-box}textarea{min-height:75px}form .btn{background:#3157d5;color:white;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:right;padding:11px 8px;border-bottom:1px solid #edf0f5}th{color:#758099}.scroll{overflow:auto}.flash{background:#fff4d9;padding:10px;border-radius:8px;margin:8px 0;font-size:13px}.inline{display:inline}footer{text-align:center;color:#8993a6;font-size:11px;padding:25px}@media(max-width:600px){header{padding:14px}.wrap{margin:15px auto}.num{font-size:22px}}</style></head><body><header><div><div class="brand">تقريري يهمك</div><div class="muted" style="color:#c8d4f5">نظام إدارة المحل</div></div>{% if session.get('uid') %}<nav><a href="/">الرئيسية</a><a href="/inventory">المخزون</a><a href="/device/add">إضافة جهاز</a><a href="/operation">عملية جديدة</a><a href="/reports">التقارير</a>{% if session.get('uid') %}<a href="/users">المستخدمون</a>{% endif %}<form class="inline" method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn">خروج</button></form></nav>{% endif %}</header><main class="wrap">{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block body %}{% endblock %}</main><footer>تقريري يهمك — نظام إدارة الأجهزة والمخزون</footer></body></html>
