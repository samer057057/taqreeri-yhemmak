{% extends "base.html" %}{% block body %}<div class="card"><h2>تسجيل عملية</h2><p class="muted">أضف الجهاز المستلم أولاً إلى المخزون من صفحة «إضافة جهاز» قبل تسجيل الشراء أو الاستبدال.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>نوع العملية</label><select name="kind"><option value="sale">بيع</option><option value="trade">استبدال</option><option value="purchase">شراء (توثيق جهاز أضيف للمخزون)</option></select><label>الجهاز الداخل / المستلم</label><select name="device_in_id"><option value="">— لا يوجد —</option>{% for d in stock %}<option value="{{d.id}}">{{d.brand}} {{d.model}} | {{d.imei or 'بدون IMEI'}}</option>{% endfor %}</select><label>الجهاز الخارج / المباع</label><select name="device_out_id"><option value="">— لا يوجد —</option>{% for d in stock %}<option value="{{d.id}}">{{d.brand}} {{d.model}} | {{d.imei or 'بدون IMEI'}}</option>{% endfor %}</select><label>اسم العميل</label><input name="customer"><label>اسم المورد</label><input name="counterparty"><label>المبلغ المحصل / المدفوع (ر.س)</label><input name="amount" type="number" step=".01" value="0"><label>الفرق في الاستبدال (+ مبلغ استلمه المحل / - مبلغ دفعه المحل)</label><input name="difference" type="number" step=".01" value="0"><label>ملاحظات</label><textarea name="notes"></textarea><button class="btn">حفظ العملية</button></form></div>{% endblock %}
