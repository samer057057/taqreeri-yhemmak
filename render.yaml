services:
  - type: web
    name: taqreeri-yhemmak
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taqreeri-db
          property: connectionString
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DAILY_REPORT_SECRET
        generateValue: true
databases:
  - name: taqreeri-db
    plan: basic
